  <g transform="matrix(1.56,-0.9,0,1.74,256,276)">
    <polygon points="60,10 24,56 47,56 38,92 78,42 55,42 66,10" fill="#ffd84d" stroke="#0a2723" stroke-width="5" stroke-linejoin="round"/>
