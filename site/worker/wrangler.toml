name = "packer-demo"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Any Groq chat model with tool use; llama-3.3-70b-versatile also works.
MODEL = "openai/gpt-oss-120b"
# Comma-separated origins allowed to call the proxy.
ALLOWED_ORIGINS = "https://packer.davide.sh,https://davidewastaken.github.io,http://127.0.0.1:8770"

# Exact rate limits (src/index.js): per visitor IP 6 per minute and 40 per day;
# whole demo 15 per minute and 700 per day, below Groq's free 30 per minute and
# 1,000 per day, which are shared by the whole Groq account.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
